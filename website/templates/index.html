<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plastic Bottle Waste Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍶 Plastic Bottle Waste Detection</h1>
            <p>Deteksi botol plastik menggunakan YOLOv8n</p>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="upload">Upload Gambar</button>
            <button class="tab-btn" data-tab="webcam">Webcam</button>
        </nav>

        <!-- Upload Tab -->
        <section id="upload" class="tab-content active">
            <div class="upload-area" id="dropZone">
                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <p>Klik atau drag gambar ke sini</p>
                <input type="file" id="fileInput" accept="image/*" hidden>
            </div>

            <div class="result-section" id="uploadResult" style="display:none;">
                <div class="result-image-wrapper">
                    <img id="uploadResultImage" alt="Hasil deteksi">
                </div>
                <div class="info-panel">
                    <h3>Hasil Deteksi</h3>
                    <div class="stat">
                        <span class="stat-label">Jumlah Botol</span>
                        <span class="stat-value" id="uploadCount">0</span>
                    </div>
                    <div class="detection-list" id="uploadDetections"></div>
                </div>
            </div>
        </section>

        <!-- Webcam Tab -->
        <section id="webcam" class="tab-content">
            <div class="webcam-controls">
                <button id="startWebcam" class="btn-primary">Start Webcam</button>
                <button id="stopWebcam" class="btn-danger" style="display:none;">Stop Webcam</button>
            </div>

            <div class="webcam-container" id="webcamContainer" style="display:none;">
                <div class="webcam-feed">
                    <img id="webcamResultImage" alt="Webcam feed">
                    <video id="webcamVideo" autoplay playsinline style="display:none;"></video>
                    <canvas id="webcamCanvas" style="display:none;"></canvas>
                </div>
                <div class="info-panel">
                    <h3>Hasil Deteksi</h3>
                    <div class="stat">
                        <span class="stat-label">Jumlah Botol</span>
                        <span class="stat-value" id="webcamCount">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Status</span>
                        <span class="stat-value" id="webcamStatus">—</span>
                    </div>
                    <div class="detection-list" id="webcamDetections"></div>
                </div>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
